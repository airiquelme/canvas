<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Canvas Demo — Design Space Scaling</title>
</head>
<body style="margin:0; overflow:hidden; background:#ffffff;">
  <canvas id="game"></canvas>
  <button id="pauseBtn" style="position:fixed; top:16px; left:16px; z-index:10; padding:8px 16px; font-size:14px; font-family:sans-serif; background:#333; color:#fff; border:1px solid #555; border-radius:6px; cursor:pointer;">Pause</button>
  <button id="themeBtn" style="position:fixed; top:16px; left:110px; z-index:10; padding:8px 16px; font-size:14px; font-family:sans-serif; background:#333; color:#fff; border:1px solid #555; border-radius:6px; cursor:pointer;">Dark mode</button>
  <button id="debugBtn" style="position:fixed; top:16px; left:230px; z-index:10; padding:8px 16px; font-size:14px; font-family:sans-serif; background:#333; color:#fff; border:1px solid #555; border-radius:6px; cursor:pointer;">Debug: off</button>
  <div style="position:fixed; left:16px; right:16px; bottom:16px; z-index:10; display:flex; align-items:center; gap:12px; font:14px sans-serif; background:rgba(51,51,51,0.85); color:#fff; padding:8px 12px; border-radius:6px;">
    <span>Angle</span>
    <input id="angleSlider" type="range" min="0" max="6.2832" step="0.002" value="0" style="flex:1;">
    <span id="angleLabel" style="min-width:48px; text-align:right; font-family:monospace;">0.000</span>
  </div>
  <button id="focusBtn" style="position:fixed; top:16px; left:340px; z-index:10; padding:8px 16px; font-size:14px; font-family:sans-serif; background:#333; color:#fff; border:1px solid #555; border-radius:6px; cursor:pointer;">Focus: off</button>
  <button id="strokeBtn" style="position:fixed; top:16px; left:450px; z-index:10; padding:8px 16px; font-size:14px; font-family:sans-serif; background:#333; color:#fff; border:1px solid #555; border-radius:6px; cursor:pointer;">Strokes: on</button>
  <button id="lightBtn" style="position:fixed; top:16px; left:560px; z-index:10; padding:8px 16px; font-size:14px; font-family:sans-serif; background:#333; color:#fff; border:1px solid #555; border-radius:6px; cursor:pointer;">Light: on</button>
  <script type="module" src="main.js"></script>
</body>
</html>
